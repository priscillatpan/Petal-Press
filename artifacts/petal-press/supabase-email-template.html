<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in to Petal Press</title>
</head>
<body style="margin:0;padding:0;background-color:#FAF7EF;font-family:Georgia,'Times New Roman',serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background-color:#FAF7EF;padding:48px 16px;">
    <tr>
      <td align="center">
        <table width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background-color:#FFFEF9;border:1px solid #E8DCC0;border-radius:16px;overflow:hidden;">

          <!-- Header -->
          <tr>
            <td align="center" style="padding:40px 40px 24px 40px;">
              <div style="font-size:32px;line-height:1;margin-bottom:16px;">✿</div>
              <h1 style="margin:0 0 8px 0;font-size:22px;font-weight:normal;color:#2C2721;letter-spacing:-0.02em;line-height:1.2;">
                Petal Press
              </h1>
              <p style="margin:0;font-size:13px;color:#9A8F7F;font-family:system-ui,-apple-system,sans-serif;letter-spacing:0.04em;">
                your personal flower diary
              </p>
            </td>
          </tr>

          <!-- Divider -->
          <tr>
            <td style="padding:0 40px;">
              <div style="border-top:1px solid #EDE6D0;"></div>
            </td>
          </tr>

          <!-- Body -->
          <tr>
            <td style="padding:32px 40px 16px 40px;text-align:center;">
              <p style="margin:0 0 8px 0;font-size:18px;color:#2C2721;line-height:1.4;">
                Here's your sign-in link
              </p>
              <p style="margin:0 0 28px 0;font-size:14px;color:#736959;font-family:system-ui,-apple-system,sans-serif;line-height:1.6;">
                Click below to open your garden. This link expires in 1 hour<br/>and can only be used once.
              </p>
              <a href="{{ .ConfirmationURL }}"
                 style="display:inline-block;padding:14px 32px;background-color:#c5d07d;color:#3D362D;text-decoration:none;border-radius:10px;font-size:14px;font-family:system-ui,-apple-system,sans-serif;font-weight:500;letter-spacing:0.01em;">
                Open my garden →
              </a>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="padding:28px 40px 36px 40px;text-align:center;">
              <p style="margin:0;font-size:12px;color:#C4BBA5;font-family:system-ui,-apple-system,sans-serif;line-height:1.6;">
                If you didn't request this, you can safely ignore it.<br/>
                made with love by <a href="https://www.instagram.com/priscilla.png/" style="color:#9A8F7F;">priscilla</a>
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
